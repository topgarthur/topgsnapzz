<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="TOPGSNAPZZ frames photos as pixel-exact 9:16 stories without side crops or black bars."
    />
    <title>TOPGSNAPZZ</title>
    <script>
      try {
        if (localStorage.getItem('topgsnapzz-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (error) {
        /* Storage can be blocked. The default theme still applies. */
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0A0A'/%3E%3Crect x='10' y='3' width='12' height='26' rx='2' fill='none' stroke='%23E4002B' stroke-width='2'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
